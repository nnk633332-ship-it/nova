name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NOVA_ALL_IN_ONE/01_MAIN_ANDROID_PROJECT/NOVA_Part9_Combined_Project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper if missing & Build APK
        run: |
          if [ ! -f ./gradlew ]; then
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.7 --distribution-type bin
              chmod +x ./gradlew
              ./gradlew assembleDebug
            else
              gradle assembleDebug
            fi
          else
            chmod +x ./gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: NOVA_ALL_IN_ONE/01_MAIN_ANDROID_PROJECT/NOVA_Part9_Combined_Project/app/build/outputs/apk/debug/*.apk
